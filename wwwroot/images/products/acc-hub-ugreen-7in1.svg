<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9F9FB"/>
      <stop offset="100%" stop-color="#F1F1F5"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E5E5EA"/>
      <stop offset="100%" stop-color="#D2D2D7"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#1D1D1F"/>
    </linearGradient>
    <linearGradient id="screenBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="50%" stop-color="#0052A3"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1D1D1F" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <circle cx="300" cy="275" r="195" fill="#FFFFFF" opacity="0.75"/>
  <!-- Top Brand Pill -->
  <rect x="36" y="34" width="136" height="32" rx="16" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.2"/>
  <text x="104" y="55" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1D1D1F" letter-spacing="0.06em">UGREEN STUDIO</text>
  <!-- Top Right Spec Pill -->
  <rect x="410" y="34" width="154" height="32" rx="16" fill="#0066CC" fill-opacity="0.10"/>
  <text x="487" y="55" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0066CC">7-IN-1 PD 100W</text>
  <!-- Hardware Studio Illustration -->
  <g filter="url(#softShadow)">
    
        <rect x="135" y="215" width="330" height="110" rx="22" fill="url(#metalGrad)" stroke="#86868B" stroke-width="3"/>
        <path d="M135 270 Q80 270 80 215" fill="none" stroke="#1D1D1F" stroke-width="8" stroke-linecap="round"/>
        <rect x="66" y="185" width="28" height="34" rx="6" fill="#0066CC"/>
        <rect x="175" y="258" width="42" height="16" rx="3" fill="#0066CC"/>
        <rect x="235" y="258" width="42" height="16" rx="3" fill="#0066CC"/>
        <rect x="295" y="258" width="52" height="18" rx="4" fill="#1D1D1F"/>
        <rect x="365" y="260" width="36" height="14" rx="6" fill="#1D1D1F"/>
        <text x="300" y="242" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1D1D1F">UGREEN 7-IN-1 USB-C HUB 4K</text>
        
  </g>
  <!-- Bottom Product Label Plate -->
  <rect x="44" y="490" width="512" height="76" rx="20" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.2"/>
  <text x="300" y="523" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1D1D1F">Hub Chuyển đổi Ugreen Type-C 7-in-1</text>
  <text x="300" y="548" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6E6E73">HDMI 4K@60Hz • 2x USB 3.0 • SD/TF • Sạc PD 100W</text>
</svg>