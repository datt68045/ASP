<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9F9FB"/>
      <stop offset="100%" stop-color="#F1F1F5"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E5E5EA"/>
      <stop offset="100%" stop-color="#D2D2D7"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#1D1D1F"/>
    </linearGradient>
    <linearGradient id="screenBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="50%" stop-color="#0052A3"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1D1D1F" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <circle cx="300" cy="275" r="195" fill="#FFFFFF" opacity="0.75"/>
  <!-- Top Brand Pill -->
  <rect x="36" y="34" width="136" height="32" rx="16" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.2"/>
  <text x="104" y="55" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1D1D1F" letter-spacing="0.06em">FRACTAL DESIGN</text>
  <!-- Top Right Spec Pill -->
  <rect x="410" y="34" width="154" height="32" rx="16" fill="#0066CC" fill-opacity="0.10"/>
  <text x="487" y="55" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0066CC">OAK WOOD FRONT</text>
  <!-- Hardware Studio Illustration -->
  <g filter="url(#softShadow)">
    
    <rect x="175" y="105" width="210" height="335" rx="18" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="3"/>
    <rect x="385" y="115" width="48" height="315" rx="10" fill="#B88655" stroke="#C7C7CC" stroke-width="2"/>
    <rect x="193" y="125" width="174" height="265" rx="12" fill="#1D1D1F"/>
    <!-- Internal Motherboard & GPU -->
    <rect x="208" y="142" width="115" height="135" rx="6" fill="#2C2C2E" stroke="#48484A" stroke-width="1.5"/>
    <circle cx="265" cy="195" r="26" fill="#1D1D1F" stroke="#D4AF37" stroke-width="3"/>
    <text x="265" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">DT</text>
    <!-- GPU Horizontal Bar -->
    <rect x="202" y="290" width="152" height="42" rx="6" fill="#3A3A3C" stroke="#D4AF37" stroke-width="2"/>
    <text x="278" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">FRACTAL NORTH</text>
    <!-- Front Fans -->
    <circle cx="409" cy="175" r="16" fill="none" stroke="#86868B" stroke-width="2"/>
    <circle cx="409" cy="235" r="16" fill="none" stroke="#86868B" stroke-width="2"/>
    <circle cx="409" cy="295" r="16" fill="none" stroke="#86868B" stroke-width="2"/>
    
  </g>
  <!-- Bottom Product Label Plate -->
  <rect x="44" y="490" width="512" height="76" rx="20" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.2"/>
  <text x="300" y="523" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1D1D1F">Vỏ Case Fractal Design North Chalk White</text>
  <text x="300" y="548" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6E6E73">ATX Mid-Tower • Mặt trước Gỗ Sồi Tự Nhiên</text>
</svg>