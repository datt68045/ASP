<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9F9FB"/>
      <stop offset="100%" stop-color="#F1F1F5"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E5E5EA"/>
      <stop offset="100%" stop-color="#D2D2D7"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#1D1D1F"/>
    </linearGradient>
    <linearGradient id="screenBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="50%" stop-color="#0052A3"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1D1D1F" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <circle cx="300" cy="275" r="195" fill="#FFFFFF" opacity="0.75"/>
  <!-- Top Brand Pill -->
  <rect x="36" y="34" width="136" height="32" rx="16" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.2"/>
  <text x="104" y="55" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1D1D1F" letter-spacing="0.06em">INTEL CORE i7</text>
  <!-- Top Right Spec Pill -->
  <rect x="410" y="34" width="154" height="32" rx="16" fill="#0066CC" fill-opacity="0.10"/>
  <text x="487" y="55" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0066CC">LGA1700 • 20 NHÂN</text>
  <!-- Hardware Studio Illustration -->
  <g filter="url(#softShadow)">
    
    <!-- PCB Substrate -->
    <rect x="155" y="115" width="290" height="290" rx="22" fill="#0E5A46" stroke="#083B2E" stroke-width="4"/>
    <!-- Gold contact pads on edges -->
    <rect x="170" y="130" width="260" height="260" rx="16" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- Intel LGA1700 Rectangular Integrated Heat Spreader (IHS) -->
    <rect x="190" y="140" width="220" height="240" rx="18" fill="url(#metalGrad)" stroke="#86868B" stroke-width="3"/>
    <rect x="210" y="160" width="180" height="200" rx="10" fill="#F5F5F7" stroke="#C7C7CC" stroke-width="1.5"/>
    <!-- Intel Core Laser Marking -->
    <rect x="235" y="182" width="130" height="28" rx="6" fill="#0066CC"/>
    <text x="300" y="201" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">INTEL CORE i7</text>
    <text x="300" y="248" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#1D1D1F">i7-14700K</text>
    <text x="300" y="280" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#6E6E73">LGA1700 SOCKET</text>
    <text x="300" y="315" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#0066CC">20 CORES • 28 THREADS • 5.6GHz</text>
    <polygon points="175,375 190,375 175,360" fill="#D4AF37"/>
    
  </g>
  <!-- Bottom Product Label Plate -->
  <rect x="44" y="490" width="512" height="76" rx="20" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.2"/>
  <text x="300" y="523" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1D1D1F">CPU Intel Core i7-14700K</text>
  <text x="300" y="548" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6E6E73">Socket LGA1700 • 20 Nhân 28 Luồng • 5.6GHz</text>
</svg>