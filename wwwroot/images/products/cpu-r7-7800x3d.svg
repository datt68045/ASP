<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9F9FB"/>
      <stop offset="100%" stop-color="#F1F1F5"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E5E5EA"/>
      <stop offset="100%" stop-color="#D2D2D7"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#1D1D1F"/>
    </linearGradient>
    <linearGradient id="screenBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="50%" stop-color="#0052A3"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1D1D1F" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <circle cx="300" cy="275" r="195" fill="#FFFFFF" opacity="0.75"/>
  <!-- Top Brand Pill -->
  <rect x="36" y="34" width="136" height="32" rx="16" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.2"/>
  <text x="104" y="55" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1D1D1F" letter-spacing="0.06em">AMD RYZEN 7</text>
  <!-- Top Right Spec Pill -->
  <rect x="410" y="34" width="154" height="32" rx="16" fill="#D9460F" fill-opacity="0.10"/>
  <text x="487" y="55" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#D9460F">SOCKET AM5</text>
  <!-- Hardware Studio Illustration -->
  <g filter="url(#softShadow)">
    
    <!-- AM5 Green/Teal PCB -->
    <rect x="155" y="115" width="290" height="290" rx="22" fill="#144D3E" stroke="#0C3328" stroke-width="4"/>
    <!-- Characteristic AM5 Octopus-style Heatspreader -->
    <rect x="190" y="150" width="220" height="220" rx="24" fill="url(#metalGrad)" stroke="#6E6E73" stroke-width="3"/>
    <!-- AM5 side notches -->
    <rect x="182" y="195" width="16" height="32" rx="4" fill="#144D3E"/>
    <rect x="182" y="293" width="16" height="32" rx="4" fill="#144D3E"/>
    <rect x="402" y="195" width="16" height="32" rx="4" fill="#144D3E"/>
    <rect x="402" y="293" width="16" height="32" rx="4" fill="#144D3E"/>
    <!-- AMD Ryzen Laser Engraving -->
    <rect x="230" y="182" width="140" height="28" rx="6" fill="#D9460F"/>
    <text x="300" y="201" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">AMD RYZEN 7</text>
    <text x="300" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#1D1D1F">7800X3D</text>
    <text x="300" y="284" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#D9460F">3D V-CACHE • SOCKET AM5</text>
    <text x="300" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#6E6E73">8 CORES • 16 THREADS • 96MB L3</text>
    
  </g>
  <!-- Bottom Product Label Plate -->
  <rect x="44" y="490" width="512" height="76" rx="20" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.2"/>
  <text x="300" y="523" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1D1D1F">CPU AMD Ryzen 7 7800X3D</text>
  <text x="300" y="548" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6E6E73">Socket AM5 • 8 Nhân 16 Luồng • 96MB 3D V-Cache</text>
</svg>