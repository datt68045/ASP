<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9F9FB"/>
      <stop offset="100%" stop-color="#F1F1F5"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E5E5EA"/>
      <stop offset="100%" stop-color="#D2D2D7"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#1D1D1F"/>
    </linearGradient>
    <linearGradient id="screenBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="50%" stop-color="#0052A3"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1D1D1F" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <circle cx="300" cy="275" r="195" fill="#FFFFFF" opacity="0.75"/>
  <!-- Top Brand Pill -->
  <rect x="36" y="34" width="136" height="32" rx="16" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.2"/>
  <text x="104" y="55" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1D1D1F" letter-spacing="0.06em">MSI MAG</text>
  <!-- Top Right Spec Pill -->
  <rect x="410" y="34" width="154" height="32" rx="16" fill="#0066CC" fill-opacity="0.10"/>
  <text x="487" y="55" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0066CC">LGA1700 • DDR5</text>
  <!-- Hardware Studio Illustration -->
  <g filter="url(#softShadow)">
    
    <rect x="145" y="105" width="310" height="330" rx="18" fill="#1D1D1F" stroke="#48484A" stroke-width="3"/>
    <!-- VRM Heatsinks -->
    <rect x="165" y="125" width="52" height="145" rx="6" fill="#E5E5EA" stroke="#86868B" stroke-width="1.5"/>
    <rect x="225" y="120" width="125" height="38" rx="6" fill="#E5E5EA" stroke="#86868B" stroke-width="1.5"/>
    <text x="287" y="144" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#1D1D1F">B760M MORTAR</text>
    <!-- CPU Socket -->
    <rect x="242" y="175" width="90" height="90" rx="10" fill="#F5F5F7" stroke="#86868B" stroke-width="2"/>
    <text x="287" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1D1D1F">LGA1700</text>
    <!-- 4 DIMM RAM Slots -->
    <rect x="360" y="140" width="10" height="145" rx="2" fill="#3A3A3C"/>
    <rect x="378" y="140" width="10" height="145" rx="2" fill="#0066CC"/>
    <rect x="396" y="140" width="10" height="145" rx="2" fill="#3A3A3C"/>
    <rect x="414" y="140" width="10" height="145" rx="2" fill="#0066CC"/>
    <!-- PCIe x16 Armor Slot -->
    <rect x="170" y="305" width="220" height="14" rx="4" fill="#D2D2D7"/>
    <!-- M.2 Heatsink & Chipset -->
    <rect x="170" y="335" width="150" height="36" rx="6" fill="#E5E5EA"/>
    <rect x="340" y="325" width="90" height="75" rx="8" fill="#E5E5EA"/>
    <text x="385" y="368" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#1D1D1F">CHIPSET</text>
    
  </g>
  <!-- Bottom Product Label Plate -->
  <rect x="44" y="490" width="512" height="76" rx="20" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.2"/>
  <text x="300" y="523" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1D1D1F">Mainboard MSI MAG B760M Mortar WiFi II</text>
  <text x="300" y="548" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6E6E73">Socket LGA1700 • 4 Khe DDR5 • WiFi 6E</text>
</svg>