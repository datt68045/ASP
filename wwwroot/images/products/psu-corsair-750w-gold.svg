<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9F9FB"/>
      <stop offset="100%" stop-color="#F1F1F5"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E5E5EA"/>
      <stop offset="100%" stop-color="#D2D2D7"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#1D1D1F"/>
    </linearGradient>
    <linearGradient id="screenBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="50%" stop-color="#0052A3"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1D1D1F" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <circle cx="300" cy="275" r="195" fill="#FFFFFF" opacity="0.75"/>
  <!-- Top Brand Pill -->
  <rect x="36" y="34" width="136" height="32" rx="16" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.2"/>
  <text x="104" y="55" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1D1D1F" letter-spacing="0.06em">CORSAIR RM</text>
  <!-- Top Right Spec Pill -->
  <rect x="410" y="34" width="154" height="32" rx="16" fill="#0066CC" fill-opacity="0.10"/>
  <text x="487" y="55" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0066CC">750W 80+ GOLD</text>
  <!-- Hardware Studio Illustration -->
  <g filter="url(#softShadow)">
    
    <rect x="130" y="145" width="340" height="240" rx="20" fill="#1D1D1F" stroke="#48484A" stroke-width="3"/>
    <circle cx="235" cy="265" r="78" fill="#2C2C2E" stroke="#6E6E73" stroke-width="3"/>
    <circle cx="235" cy="265" r="55" fill="none" stroke="#48484A" stroke-width="2"/>
    <circle cx="235" cy="265" r="24" fill="#1D1D1F" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="235" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">CORSAIR</text>
    <rect x="330" y="195" width="120" height="140" rx="12" fill="#2C2C2E"/>
    <text x="390" y="245" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">RM750e</text>
    <rect x="342" y="265" width="96" height="28" rx="6" fill="#D4AF37"/>
    <text x="390" y="284" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#1D1D1F">750W GOLD</text>
    
  </g>
  <!-- Bottom Product Label Plate -->
  <rect x="44" y="490" width="512" height="76" rx="20" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.2"/>
  <text x="300" y="523" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1D1D1F">Nguồn Corsair RM750e 750W 80 Plus Gold</text>
  <text x="300" y="548" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6E6E73">Full Modular ATX 3.0 • Cáp PCIe 5.0 12VHPWR</text>
</svg>